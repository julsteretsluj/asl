<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        try {
          var stored = JSON.parse(localStorage.getItem("signspace-access") || "null");
          var chosen = stored && Object.prototype.hasOwnProperty.call(stored, "darkMode") ? stored.darkMode : null;
          var dark = chosen === null || chosen === undefined
            ? window.matchMedia("(prefers-color-scheme: dark)").matches
            : Boolean(chosen);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
    <title>SignSpace · Inclusive ASL Academy</title>
    <meta
      name="description"
      content="Study American Sign Language grammar, classroom gloss, spatial verbs, and non-manual markers. Includes manual tone cues, slower playback, and soft-gaze guidance."
    />
    <link rel="icon" href="/signspace-logo.png" type="image/png" />
    <link rel="apple-touch-icon" href="/signspace-logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=Merriweather:ital,wght@0,400;0,700;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
